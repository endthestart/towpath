[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "towpath"
version = "0.0.1"
description = "Self-hosted tools for managing your digital life and building an evidence-linked life stream"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
towpath = "towpath.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B008"]  # Typer declares options as argument defaults
