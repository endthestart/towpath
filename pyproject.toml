[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "towpath"
version = "0.0.1"
description = "Self-hosted tools for managing your digital life and building an evidence-linked life stream"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
models = ["openai>=1.40", "jsonschema>=4.20", "json-repair>=0.30"]
gmail = ["google-api-python-client>=2.100", "google-auth>=2.30", "google-auth-oauthlib>=1.2"]
web = ["Django>=5.2.17,<5.3"]
imap = ["IMAPClient>=4.1,<5"]
dev = ["pytest>=8", "ruff>=0.6", "towpath[models,gmail,web,imap]"]

[project.scripts]
towpath = "towpath.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"towpath.web" = ["templates/*.html", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B008"]  # Typer declares options as argument defaults
