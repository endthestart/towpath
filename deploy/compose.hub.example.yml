# Single-owner deployment. CI builds; Arcane pulls these immutable image references.
# The UI publishes no port: it joins the reverse proxy's network and every page needs the one account
# (first-run setup code in the web container's log). See docs/setup/hub.md.
name: towpath

x-runtime: &runtime
  image: ${TOWPATH_IMAGE:?set a published core image digest}
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  stop_grace_period: 60s

services:
  web:
    <<: *runtime
    command: ["web", "serve", "--store-dir", "/state", "--config", "/config/towpath.toml", "--port", "8790",
              "--host", "0.0.0.0", "--public-url", "${TOWPATH_PUBLIC_URL:?set the proxy's https URL}"]
    networks:
      proxy:
        aliases: [towpath-web]
    restart: unless-stopped
    volumes:
      - ${TOWPATH_STATE_DIR:?set private state directory}:/state
      - ${TOWPATH_WEB_CONFIG_DIR:?set credential-free UI configuration directory}:/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8790/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3

  connect:
    <<: *runtime
    image: ${TOWPATH_RECOLL_IMAGE:?set a published Recoll image digest}
    command: ["connect", "run-worker", "--config", "/config/towpath.toml"]
    restart: "on-failure:3"
    environment:
      TOWPATH_CREDENTIALS_DIR: /run/tokens  # passwords added on the Connections page
    volumes:
      - ${TOWPATH_STATE_DIR}:/state
      - ${TOWPATH_CONFIG_DIR:?set private connector configuration directory}:/config:ro
      - ${TOWPATH_SECRETS_DIR:?set private credential directory}:/run/secrets:ro
      - ${TOWPATH_TOKEN_DIR:?set private refreshable OAuth token directory}:/run/tokens
      - ${TOWPATH_SOURCE_DIR:?set read-only NAS root}:/data/roots/archive:ro
      - ${TOWPATH_INDEX_DIR:?set separate index directory}:/index:ro

  # Connection setup pages (/connections/): the only service that receives passwords. The proxy sends
  # /connections/ here and everything else to web. It writes only the connections store and the
  # credentials folder; indexing itself runs in connect.
  connect-setup:
    <<: *runtime
    image: ${TOWPATH_RECOLL_IMAGE}
    command: ["connect", "serve-setup", "--config", "/config/towpath.toml", "--host", "0.0.0.0", "--port", "8791",
              "--public-url", "${TOWPATH_PUBLIC_URL}"]
    restart: unless-stopped
    environment:
      TOWPATH_CREDENTIALS_DIR: /run/tokens
    networks:
      default: {}
      proxy:
        aliases: [towpath-connect-setup]
    volumes:
      - ${TOWPATH_STATE_DIR}:/state
      - ${TOWPATH_CONFIG_DIR}:/config:ro
      - ${TOWPATH_TOKEN_DIR}:/run/tokens
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8791/assets/app.css', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Manual metadata sync, not started by normal deployment. Existing shared quota accounting applies.
  mail-sync:
    <<: *runtime
    profiles: ["mail-sync"]
    command: ["connect", "sync", "${TOWPATH_MAIL_SOURCE:-gmail}", "--config", "/config/towpath.toml"]
    restart: "no"
    volumes:
      - ${TOWPATH_STATE_DIR}:/state
      - ${TOWPATH_CONFIG_DIR}:/config:ro
      - ${TOWPATH_SECRETS_DIR}:/run/secrets:ro
      - ${TOWPATH_TOKEN_DIR}:/run/tokens

  # Manual only. Supply the qualified NAS root, separate on-disk index and scratch directories.
  recoll-index:
    <<: *runtime
    image: ${TOWPATH_RECOLL_IMAGE:?set a published Recoll image digest}
    profiles: ["index"]
    network_mode: none
    entrypoint: ["recollindex"]
    command: ["-c", "/index/recoll"]
    restart: "no"
    tmpfs: []
    volumes:
      - ${TOWPATH_SOURCE_DIR:?set read-only NAS root}:/data/roots/archive:ro
      - ${TOWPATH_INDEX_DIR:?set separate index directory}:/index
      - ${TOWPATH_SCRATCH_DIR:?set on-disk scratch directory}:/tmp

networks:
  proxy:
    external: true
    name: ${TOWPATH_PROXY_NETWORK:?set the reverse proxy's Docker network}
