# Towpath for one owner, behind an existing reverse proxy. Paste into Arcane (or any Compose host) with
# env.hub.example filled in. CI builds the images; this file only pulls them by digest.
#
# One data folder holds everything; the containers create its layout on first start. The web service sees
# only state/; passwords and tokens in credentials/ are visible only to the two connector services.
# Folders to index are mounted read-only under /library, also only in the connector services.
# Install guide: docs/setup/install.md.
name: towpath

x-runtime: &runtime
  user: "${TOWPATH_USER:-568:568}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  stop_grace_period: 60s

services:
  # Connections pages (/connections/): the only service that receives passwords. Starts first and creates
  # the data folder's layout.
  connect-setup:
    <<: *runtime
    image: ${TOWPATH_RECOLL_IMAGE:?set the published towpath-recoll image digest}
    command: ["connect", "serve-setup", "--data-dir", "/data", "--host", "0.0.0.0", "--port", "8791",
              "--public-url", "${TOWPATH_PUBLIC_URL:?set the address the proxy serves}"]
    restart: unless-stopped
    networks:
      default: {}
      proxy:
        aliases: [towpath-connect-setup]
    group_add: ["${TOWPATH_READ_GROUP:-568}"]  # a group allowed to read the library, if it needs one
    volumes:
      - ${TOWPATH_DATA_DIR:?set the data folder}:/data
      - ${TOWPATH_LIBRARY_DIR:-${TOWPATH_DATA_DIR}/library}:/library:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8791/assets/app.css', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Runs searches, content requests and the indexing you start on the Connections page. Never on its own.
  connect:
    <<: *runtime
    image: ${TOWPATH_RECOLL_IMAGE}
    command: ["connect", "run-worker", "--data-dir", "/data"]
    restart: unless-stopped
    depends_on:
      connect-setup: {condition: service_healthy}
    group_add: ["${TOWPATH_READ_GROUP:-568}"]
    volumes:
      - ${TOWPATH_DATA_DIR}:/data
      - ${TOWPATH_LIBRARY_DIR:-${TOWPATH_DATA_DIR}/library}:/library:ro

  web:
    <<: *runtime
    image: ${TOWPATH_IMAGE:?set the published towpath image digest}
    command: ["web", "serve", "--data-dir", "/data", "--host", "0.0.0.0", "--port", "8790",
              "--public-url", "${TOWPATH_PUBLIC_URL}"]
    restart: unless-stopped
    depends_on:
      connect-setup: {condition: service_healthy}  # state/ exists, owned by the right user, before it is mounted
    networks:
      proxy:
        aliases: [towpath-web]
    volumes:
      - ${TOWPATH_DATA_DIR}/state:/data/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8790/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  proxy:
    external: true
    name: ${TOWPATH_PROXY_NETWORK:?set the reverse proxy's Docker network}
