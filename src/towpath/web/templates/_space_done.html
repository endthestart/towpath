{% if done %}<div class="notice" role="status"><form method="post" action="/space/keep" class="inline-form">{% csrf_token %}<input type="hidden" name="root" value="{{ done.alias }}"><input type="hidden" name="path" value="{{ done.path }}"><input type="hidden" name="keep" value="{% if done.done == 'kept' %}0{% else %}1{% endif %}"><input type="hidden" name="next" value="{{ back|default:'/space/' }}"><span>{% if done.done == 'kept' %}Kept <strong>{{ done.where }}</strong>: it's no longer counted as clutter. Clutter inside it is still listed.{% else %}<strong>{{ done.where }}</strong> counts as clutter again.{% endif %}</span><button class="button secondary" type="submit">Undo</button></form></div>{% endif %}
