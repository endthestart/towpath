# Example Towpath configuration. Copy it to a private folder OUTSIDE this
# repository (for example ~/towpath-private/towpath.toml) and edit there.
# Paths are relative to the copied file. Secrets are never written here:
# credentials are references (env:NAME, file:PATH, or none).

[stores]
dir = "state"

# Gmail pacing. These defaults are the maximum rates without a verified quota;
# lower them if your Google Cloud project's quotas require. One budget per project.
[gmail_pacing]
budget_id = "default"
min_interval_seconds = 1.0
units_per_minute = 1200
# Optional: record the per-user quota verified in your own Cloud Console.
# verified_units_per_minute = <verified positive integer>
# Opt-in permits at most 30% of that quota, capped at 1800 units/minute.
# It does not increase daily_units.
daily_units = 1800000
checkpoint_every = 25

# Gmail, read-only, with your own Google OAuth client (docs/setup/local-quickstart.md).
[[sources]]
id = "gmail_test"
kind = "mail-provider"
adapter = "gmail"
client_secrets = "secrets/google-oauth-client.json"
token = "secrets/gmail-token.json"

# Another mail account over IMAP, read-only (EXAMINE and BODY.PEEK only). Needs: pip install 'towpath[imap]'.
# [[sources]]
# id = "imap_personal"
# kind = "mail-provider"
# adapter = "imap"
# host = "imap.example.net"
# username = "me@example.net"
# password = "env:TOWPATH_IMAP_PASSWORD"   # or file:secrets/imap-password; never the secret itself
# security = "tls"                        # tls (port 993) or starttls (port 143)
# mailboxes = ["INBOX", "Archive"]        # omit for every selectable mailbox

# Paperless-ngx, read through a view-only user's API token.
[[sources]]
id = "paperless"
kind = "document-system"
adapter = "paperless"
base_url = "http://localhost:8000"
token = "file:secrets/paperless-token"

# Immich, read through an API key limited to asset read permissions.
[[sources]]
id = "immich"
kind = "photo-library"
adapter = "immich"
base_url = "http://localhost:2283"
token = "file:secrets/immich-api-key"

[[selectors]]
id = "pdf-to-paperless"
media_types = ["application/pdf"]
disposition = "attachment"
min_bytes = 1
destination = "paperless"
exclude_labels = ["SPAM", "TRASH"]
classifier = "doc.is_statement"

[[selectors]]
id = "photos-to-immich"
media_types = ["image/jpeg", "image/png", "image/heic"]
disposition = "attachment"
min_bytes = 20000
destination = "immich"
exclude_labels = ["SPAM", "TRASH"]

# A model server on this machine (Ollama shown; llama.cpp server uses port 8080).
[endpoints.local]
base_url = "http://127.0.0.1:11434/v1"
credential = "none"
model = "replace-with-a-local-model"
kind = "chat"
destination = "this-machine"
allow_data = ["synthetic", "metadata"]
timeout_seconds = 120

[tasks]
"doc.is_statement" = "local"

