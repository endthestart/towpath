# Example configuration for optional file discovery (docs/file-discovery.md).
# It works on its own: no mail source, model endpoint, or life-stream feature is needed.
# Copy it OUTSIDE this repository and edit there. Paths are relative to the copied file.
# To try it on synthetic files instead: towpath fixtures files /tmp/towpath-files

[stores]
dir = "state"

[files]
enabled = true
recover_dir = "state/recovered"   # derived copies; never inside or around a root

[files.limits]
max_results = 20
max_scan = 500
max_excerpt_bytes = 2000
max_recover_bytes = 50000000
timeout_seconds = 30
max_output_bytes = 4000000

# A folder an existing search tool already indexes. Nothing is shown from it until
# you grant a feature on it: towpath files grant old-backups search
[[files.roots]]
alias = "old-backups"
path = "/srv/archive/old-backups"
exclude = ["private/*"]

# Recoll, installed and indexed by you (recollindex -c <confdir>). Towpath only queries it.
# python must be an interpreter that can `import recoll` (the binding is built for one version).
[[files.providers]]
id = "recoll"
adapter = "recoll"
roots = ["old-backups"]
confdir = "/srv/recoll/old-backups"
python = "/usr/bin/python3"

# sist2 is a capability slot only: probe reports its version; search is not implemented.
# [[files.providers]]
# id = "sist2"
# adapter = "sist2"
# roots = ["old-backups"]
# command = ["sist2"]

# An existing inventory of files a text indexer skips (for example camera raw images). Towpath reads the
# manifest, never the files: references and metadata only. Format: docs/file-discovery.md#manifest-adapter
# [[files.roots]]
# alias = "photos"
# path = "/srv/archive/photos"
#
# [[files.providers]]
# id = "inventory"
# adapter = "manifest"
# roots = ["photos"]
# manifests = ["/srv/inventories/photos.jsonl"]
